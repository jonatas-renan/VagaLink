name: Gerar APK Android

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-android:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Clonar o repositório
        uses: actions/checkout@v4

      - name: 🟢 Configurar Node.js (Versão 24)
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: 📦 Instalar Dependências (NPM)
        run: npm install

      - name: 🏗️ Fazer o Build do React
        run: npm run build

      - name: 🔄 Sincronizar o Capacitor
        run: npx cap sync android

      - name: ☕ Configurar Java (JDK 17 - Zulu)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: 🔓 Liberar permissão do Gradle
        run: chmod +x android/gradlew

      - name: 🛠️ Compilar o APK (Debug)
        run: cd android && ./gradlew assembleDebug

      - name: 🚀 Disponibilizar APK para Download
        uses: actions/upload-artifact@v4
        with:
          name: VagaLink-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk